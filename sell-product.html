<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function(){
      var t = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <title>Dealer - Add & Manage Products</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="navbar">
    <h2>Dealer Dashboard</h2>
    <div>
      <a href="sell-product.html">Add & Manage Products</a>
      <a href="dealer-orders.html">Customer Orders</a>
      <a href="messages.html">Messages</a>
      <a href="profile.html">Profile</a>
      <span id="dealerEmail" style="margin-left: 15px;"></span>
      <a href="#" onclick="logout()">Logout</a>
      <button id="theme-toggle" class="theme-toggle" title="Toggle theme">🌙</button>
    </div>
  </div>

  <div class="container" style="max-width: 600px;">
    <h3>Post New Item For Sale</h3>
    <form id="sellForm" onsubmit="addProduct(event)">
      <div class="form-group">
        <label>Product Title</label>
        <input type="text" id="item-title" required placeholder="e.g. Wireless Mouse">
      </div>
      <div class="form-group">
        <label>Price ($)</label>
        <input type="number" id="item-price" step="0.01" required placeholder="e.g. 29.99">
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="item-category" required>
          <!-- populated from APP_CATEGORIES in js/config.js so it always matches the store's browse categories -->
        </select>
      </div>
      <div class="form-group">
        <label>Image URL</label>
        <input type="url" id="item-image" required placeholder="https://via.placeholder.com/150">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="item-desc" rows="3" required placeholder="Product details..."></textarea>
      </div>
      <button type="submit" class="btn-secondary">Publish Item</button>
    </form>

    <hr style="margin: 30px 0;">

    <h3>My Published Products</h3>
    <div id="myProductsList"></div>
  </div>  <div style="text-align:center; padding:24px 20px; color:var(--text-muted); font-size:13px; border-top:1px solid var(--border-color); margin-top:20px;">
    <a href="about.html" style="color:var(--text-muted); margin:0 8px;">About</a> |
    <a href="contact.html" style="color:var(--text-muted); margin:0 8px;">Contact</a> |
    <a href="faq.html" style="color:var(--text-muted); margin:0 8px;">FAQ</a>
  </div>



  <script src="js/config.js"></script>

  <script src="js/theme.js"></script>

  <script src="js/localdb.js"></script>

  <script src="js/auth.js"></script>
  <script src="js/dealer.js"></script>
</body>
</html>
