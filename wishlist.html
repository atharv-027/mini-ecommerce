<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function(){
      var t = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <title>My Wishlist - Mini E-Commerce</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="navbar">
    <h2>E-Shop</h2>
    <div>
      <a href="store.html">Products</a>
      <a href="cart.html">Cart (<span id="cartCount">0</span>)</a>
      <a href="wishlist.html">Wishlist</a>
      <a href="messages.html">Messages</a>
      <a href="orders.html">My Orders</a>
      <a href="profile.html">Profile</a>
      <a href="#" onclick="logout()">Logout</a>
      <button id="theme-toggle" class="theme-toggle" title="Toggle theme">🌙</button>
    </div>
  </div>

  <div class="container">
    <h2>My Wishlist</h2>
    <div class="grid" id="wishlistGrid"></div>
  </div>  <div style="text-align:center; padding:24px 20px; color:var(--text-muted); font-size:13px; border-top:1px solid var(--border-color); margin-top:20px;">
    <a href="about.html" style="color:var(--text-muted); margin:0 8px;">About</a> |
    <a href="contact.html" style="color:var(--text-muted); margin:0 8px;">Contact</a> |
    <a href="faq.html" style="color:var(--text-muted); margin:0 8px;">FAQ</a>
  </div>



  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/localdb.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const session = verifyAccess('user');
      if (!session) return;

      updateCartCountLocal();

      const grid = document.getElementById('wishlistGrid');
      grid.innerHTML = '<p class="empty-state">Loading wishlist...</p>';

      try {
        let products;
        try {
          const response = await fetch(`${API_BASE_URL}/api/wishlist/${encodeURIComponent(session.email)}`);
          products = await response.json();
        } catch (networkErr) {
          products = ldbGetWishlist(session.email);
        }

        if (!products.length) {
          grid.innerHTML = '<p class="empty-state">Your wishlist is empty. Browse the store and tap the heart icon to save items here.</p>';
          return;
        }

        grid.innerHTML = products.map(p => `
          <div class="card">
            <button class="wishlist-heart active" onclick="removeFromWishlist('${p.id}', this)" title="Remove from wishlist">♥</button>
            <img src="${p.image}" alt="${p.title}">
            <h4>${p.title}</h4>
            <p style="color:#2874f0; font-size:12px;">Seller: ${p.dealerName || p.dealerEmail}</p>
            <p style="color:#388e3c; font-weight:bold;">$${Number(p.price).toFixed(2)}</p>
            <button class="btn-secondary" onclick="window.location.href='product-details.html?id=${p.id}'">View Product</button>
          </div>
        `).join('');
      } catch (error) {
        grid.innerHTML = '<p class="empty-state">Could not load wishlist.</p>';
      }
    });

    function updateCartCountLocal() {
      const cart = JSON.parse(localStorage.getItem('userCart') || '[]');
      const counter = document.getElementById('cartCount');
      if (counter) counter.innerText = cart.length;
    }

    async function removeFromWishlist(productId, btnEl) {
      const session = JSON.parse(localStorage.getItem('userSession'));
      try {
        await fetch(`${API_BASE_URL}/api/wishlist/${encodeURIComponent(session.email)}/${productId}`, { method: 'DELETE' });
      } catch (networkErr) {
        ldbRemoveWishlist(session.email, productId);
      }
      btnEl.closest('.card').remove();
    }
  </script>
</body>
</html>
