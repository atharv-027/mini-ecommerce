<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function(){
      var t = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <title>E-Store</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="navbar">
    <h2>E-Shop</h2>
    <div>
      <a href="store.html">Products</a>
      <a href="#" onclick="scrollToCategories(); return false;">Explore</a>
      <a href="cart.html">Cart (<span id="cartCount">0</span>)</a>
      <a href="wishlist.html">Wishlist</a>
      <a href="messages.html">Messages</a>
      <a href="orders.html">My Orders</a>
      <a href="profile.html">Profile</a>
      <a href="#" onclick="logout()">Logout</a>
      <button id="theme-toggle" class="theme-toggle" title="Toggle theme">🌙</button>
    </div>
  </div>

  <!-- SEARCH BAR -->
  <div class="search-bar-wrap">
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search for products, brands and more...">
      <button class="btn-outline" id="filterToggleBtn" onclick="toggleFilterPanel()" type="button">⚙️ Filters</button>
    </div>

    <!-- FILTER PANEL (price range + sort) -->
    <div class="filter-panel" id="filterPanel" style="display:none;">
      <div class="filter-field">
        <label>Min Price ($)</label>
        <input type="number" id="minPriceInput" min="0" placeholder="0">
      </div>
      <div class="filter-field">
        <label>Max Price ($)</label>
        <input type="number" id="maxPriceInput" min="0" placeholder="Any">
      </div>
      <div class="filter-field">
        <label>Sort By</label>
        <select id="sortSelect">
          <option value="newest">Newest First</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="name-az">Name: A to Z</option>
        </select>
      </div>
      <button class="btn-primary" style="width:auto; padding:11px 20px;" onclick="applyFilters()">Apply</button>
      <button class="btn-outline" style="width:auto;" onclick="clearFilters()">Clear All</button>
    </div>
  </div>

  <!-- CATEGORY / EXPLORE TILES -->
  <div class="category-strip" id="categorySection">
    <div class="category-tile active" data-category="" onclick="selectCategory('', this)">
      <span class="category-icon">🛍️</span>
      <span>All</span>
    </div>
    <div id="categoryTiles"></div>
  </div>

  <p id="resultsSummary" class="results-summary"></p>

  <div class="grid" id="productGrid"></div>  <div style="text-align:center; padding:24px 20px; color:var(--text-muted); font-size:13px; border-top:1px solid var(--border-color); margin-top:20px;">
    <a href="about.html" style="color:var(--text-muted); margin:0 8px;">About</a> |
    <a href="contact.html" style="color:var(--text-muted); margin:0 8px;">Contact</a> |
    <a href="faq.html" style="color:var(--text-muted); margin:0 8px;">FAQ</a>
  </div>



  <script src="js/config.js"></script>

  <script src="js/theme.js"></script>

  <script src="js/localdb.js"></script>

  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
</body>
</html>
