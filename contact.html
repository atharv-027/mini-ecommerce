<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function(){
      var t = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <title>Contact Us - Mini E-Commerce</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="navbar">
    <h2>E-Shop</h2>
    <div>
      <a href="store.html">Products</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="faq.html">FAQ</a>
      <button id="theme-toggle" class="theme-toggle" title="Toggle theme">🌙</button>
    </div>
  </div>

  <div class="container" style="max-width: 500px;">
    <h2>Contact Us</h2>
    <p style="color:var(--text-muted); margin-bottom:20px;">Have a question or feedback? Send us a message below.</p>

    <form id="contact-form" onsubmit="handleContactSubmit(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="contact-name" required placeholder="Your name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="contact-email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea id="contact-msg" rows="5" required placeholder="Type your message here..."></textarea>
      </div>
      <button type="submit" class="btn-primary">Send Message</button>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/localdb.js"></script>
  <script>
    function handleContactSubmit(e) {
      e.preventDefault();
      alert('Thank you! Your message has been noted.');
      document.getElementById('contact-form').reset();
    }
  </script>
</body>
</html>
