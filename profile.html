<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function(){
      var t = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <title>My Profile - Mini E-Commerce</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="navbar">
    <h2 id="nav-title">E-Shop</h2>
    <div id="nav-links"></div>
  </div>

  <div class="container" style="max-width: 500px;">
    <h2>My Profile</h2>
    <div id="profile-info" class="empty-state">Loading profile...</div>

    <form id="profileForm" style="display:none;" onsubmit="saveProfile(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="profile-name">
      </div>
      <div class="form-group">
        <label>Email (cannot be changed)</label>
        <input type="email" id="profile-email" disabled>
      </div>
      <div class="form-group">
        <label>Account Type</label>
        <input type="text" id="profile-role" disabled>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="profile-phone" pattern="[0-9]{10}" placeholder="10-digit mobile number">
      </div>
      <div class="form-group">
        <label>Gender</label>
        <select id="profile-gender">
          <option value="">Prefer not to say</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" id="profile-dob">
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea id="profile-address" rows="2" placeholder="Your address"></textarea>
      </div>
      <div class="form-group">
        <label>About / Bio</label>
        <textarea id="profile-bio" rows="3" placeholder="A short line about yourself"></textarea>
      </div>

      <!-- DEALER-ONLY FIELDS -->
      <div id="dealerProfileFields" style="display:none;">
        <hr style="margin: 20px 0;">
        <h3>Shop Details</h3>
        <div class="form-group">
          <label>Shop Name</label>
          <input type="text" id="profile-shop-name" placeholder="e.g. Rahul Electronics">
        </div>
        <div class="form-group">
          <label>Shop Address</label>
          <input type="text" id="profile-shop-address" placeholder="Shop address">
        </div>
        <div class="form-group">
          <label>Shop Contact Number</label>
          <input type="tel" id="profile-shop-phone" pattern="[0-9]{10}" placeholder="10-digit phone number">
        </div>
      </div>

      <hr style="margin: 20px 0;">
      <h3>Change Password (optional)</h3>
      <div class="form-group">
        <label>Current Password</label>
        <input type="password" id="curr-pass" placeholder="Leave blank if not changing password">
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="new-pass" placeholder="At least 8 characters">
      </div>

      <button type="submit" class="btn-primary">Save Changes</button>
    </form>
  </div>  <div style="text-align:center; padding:24px 20px; color:var(--text-muted); font-size:13px; border-top:1px solid var(--border-color); margin-top:20px;">
    <a href="about.html" style="color:var(--text-muted); margin:0 8px;">About</a> |
    <a href="contact.html" style="color:var(--text-muted); margin:0 8px;">Contact</a> |
    <a href="faq.html" style="color:var(--text-muted); margin:0 8px;">FAQ</a>
  </div>



  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/localdb.js"></script>
  <script src="js/auth.js"></script>

  <script>
    let session = null;

    document.addEventListener('DOMContentLoaded', async () => {
      session = requireAnySession();
      if (!session) return;

      buildNavbar();
      await loadProfile();
    });

    function buildNavbar() {
      document.getElementById('nav-title').textContent = session.role === 'dealer' ? 'Dealer Dashboard' : 'E-Shop';
      const links = session.role === 'dealer'
        ? [['sell-product.html', 'Add & Manage Products'], ['dealer-orders.html', 'Customer Orders'], ['messages.html', 'Messages'], ['profile.html', 'Profile']]
        : [['store.html', 'Products'], ['cart.html', 'Cart'], ['wishlist.html', 'Wishlist'], ['messages.html', 'Messages'], ['orders.html', 'My Orders'], ['profile.html', 'Profile']];

      const container = document.getElementById('nav-links');
      container.innerHTML = links.map(([href, label]) => `<a href="${href}">${label}</a>`).join('')
        + `<a href="#" onclick="logout()">Logout</a>`
        + `<button id="theme-toggle" class="theme-toggle" title="Toggle theme">🌙</button>`;

      const btn = document.getElementById('theme-toggle');
      btn.textContent = (document.documentElement.getAttribute('data-theme') === 'dark') ? '☀️' : '🌙';
      btn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        btn.textContent = next === 'dark' ? '☀️' : '🌙';
      });
    }

    async function loadProfile() {
      const infoEl = document.getElementById('profile-info');
      let user;
      try {
        const response = await fetch(`${API_BASE_URL}/api/users/${encodeURIComponent(session.email)}?role=${session.role}`);
        user = await response.json();
      } catch (networkErr) {
        try {
          user = ldbGetUser(session.email, session.role);
        } catch (localErr) {
          infoEl.textContent = 'Could not load profile.';
          return;
        }
      }

      infoEl.style.display = 'none';
      document.getElementById('profileForm').style.display = 'block';
      document.getElementById('profile-name').value = user.name || '';
      document.getElementById('profile-email').value = user.email;
      document.getElementById('profile-role').value = user.role === 'dealer' ? 'Dealer' : 'User';
      document.getElementById('profile-phone').value = user.phone || '';
      document.getElementById('profile-gender').value = user.gender || '';
      document.getElementById('profile-dob').value = user.dob || '';
      document.getElementById('profile-address').value = user.address || '';
      document.getElementById('profile-bio').value = user.bio || '';

      if (user.role === 'dealer') {
        document.getElementById('dealerProfileFields').style.display = 'block';
        document.getElementById('profile-shop-name').value = user.shopName || '';
        document.getElementById('profile-shop-address').value = user.shopAddress || '';
        document.getElementById('profile-shop-phone').value = user.shopPhone || '';
      }
    }

    async function saveProfile(event) {
      event.preventDefault();
      const name = document.getElementById('profile-name').value.trim();
      const currentPassword = document.getElementById('curr-pass').value;
      const newPassword = document.getElementById('new-pass').value;
      const phone = document.getElementById('profile-phone').value.trim();
      const gender = document.getElementById('profile-gender').value;
      const dob = document.getElementById('profile-dob').value;
      const address = document.getElementById('profile-address').value.trim();
      const bio = document.getElementById('profile-bio').value.trim();

      let shopName, shopAddress, shopPhone;
      if (session.role === 'dealer') {
        shopName = document.getElementById('profile-shop-name').value.trim();
        shopAddress = document.getElementById('profile-shop-address').value.trim();
        shopPhone = document.getElementById('profile-shop-phone').value.trim();
      }

      if (newPassword && newPassword.length < 8) {
        alert('New password must be at least 8 characters long.');
        return;
      }
      if (newPassword && !currentPassword) {
        alert('Please enter your current password to set a new one.');
        return;
      }

      const payload = {
        name, currentPassword, newPassword: newPassword || undefined, role: session.role,
        phone, gender, dob, address, bio, shopName, shopAddress, shopPhone
      };

      let data;
      try {
        const response = await fetch(`${API_BASE_URL}/api/users/${encodeURIComponent(session.email)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        data = await response.json();
        if (!response.ok) {
          alert(data.message || 'Could not save changes.');
          return;
        }
      } catch (networkErr) {
        try {
          data = ldbUpdateUser(session.email, session.role, payload);
        } catch (localErr) {
          alert(localErr.message);
          return;
        }
      }

      // keep local session name in sync
      session.name = data.name;
      localStorage.setItem('userSession', JSON.stringify(session));

      document.getElementById('curr-pass').value = '';
      document.getElementById('new-pass').value = '';
      alert('Profile updated successfully!');
    }
  </script>
</body>
</html>
